server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    # SEM barra final: encaminha /api/auth/login inteiro. Com "…:3001/;" o nginx
    # removeria o prefixo /api e TODA rota daria 404.
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O shell nunca pode ser cacheado: senão o convidado roda o JavaScript do mês
  # passado contra a API de hoje. Os /assets/ têm hash e são imutáveis.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Fallback de histórico da SPA: /login e /admin são rotas do React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
