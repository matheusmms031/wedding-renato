server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # O padrão do nginx é 1 MB, e foto de celular tem de 2 a 5 MB: sem isto o
  # upload morre aqui, antes de chegar ao backend.
  #
  # 20M com folga proposital sobre o limite real de 5 MB: assim quem recusa é
  # sempre o backend, com mensagem em português dizendo o tamanho. Quando o
  # nginx recusa, ele devolve uma página HTML crua que o painel não consegue
  # interpretar.
  client_max_body_size 20M;

  location /api/ {
    # SEM barra final: encaminha /api/auth/login inteiro. Com "…:3001/;" o nginx
    # removeria o prefixo /api e TODA rota daria 404.
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O shell nunca pode ser cacheado: senão o convidado roda o JavaScript do mês
  # passado contra a API de hoje. Os /assets/ têm hash e são imutáveis.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Imagens dos presentes, gravadas pelo backend no volume compartilhado.
  # Vem antes do fallback da SPA: sem isto, /uploads/x.png devolveria o
  # index.html com status 200 e a imagem "sumiria" sem erro nenhum.
  location /uploads/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Fallback de histórico da SPA: /login e /admin são rotas do React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
