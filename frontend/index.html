<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Casamento de Renato e Marília — 20 de dezembro de 2026, Condomínio Mirante do Lago, Palmas TO."
    />
    <meta name="theme-color" content="#faf7f0" />
    <link rel="canonical" href="https://renatoemarilia.site/" />

    <!-- Open Graph: é isto que monta o card quando o link é colado no
         WhatsApp, que é como o convite vai chegar aos convidados. Sem estas
         tags o link aparece como texto cru, sem foto e sem título. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Renato &amp; Marília" />
    <meta property="og:url" content="https://renatoemarilia.site/" />
    <meta property="og:title" content="Renato &amp; Marília · 20 de dezembro de 2026" />
    <meta
      property="og:description"
      content="Casamento de Renato e Marília — 20 de dezembro de 2026, Condomínio Mirante do Lago, Palmas TO."
    />
    <!-- URL absoluta e 1200x630: o WhatsApp ignora caminho relativo e corta
         mal qualquer proporção diferente desta. -->
    <meta property="og:image" content="https://renatoemarilia.site/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Renato e Marília" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Renato &amp; Marília · 20 de dezembro de 2026" />
    <meta
      name="twitter:description"
      content="Casamento de Renato e Marília — 20 de dezembro de 2026, Condomínio Mirante do Lago, Palmas TO."
    />
    <meta name="twitter:image" content="https://renatoemarilia.site/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Renato &amp; Marília · 20 de dezembro de 2026</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
