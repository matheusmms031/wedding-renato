<!-- @dsCard group="Wedding Website" viewport="1440x900" name="Wedding Website" subtitle="Home page with RSVP flow" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./image-slot.js"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="SiteNavBar.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Verse.jsx"></script>
<script type="text/babel" src="Venue.jsx"></script>
<script type="text/babel" src="GiftsSection.jsx"></script>
<script type="text/babel" src="RSVPSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<script>window.useNarrow=function(bp){const[n,s]=React.useState(window.innerWidth<bp);React.useEffect(()=>{const h=()=>s(window.innerWidth<bp);window.addEventListener('resize',h);return()=>window.removeEventListener('resize',h)},[bp]);return n};</script>
</head><body>
<div id="root"></div>
<script type="text/babel">
function App(){
const [logged,setLogged]=React.useState(false);
if(!logged) return <LoginScreen onLogin={()=>setLogged(true)}/>;
return (<React.Fragment>
<SiteNavBar active="RSVP"/>
<Hero/>
<Verse/>
<Venue/>
<GiftsSection/>
<RSVPSection/>
<Footer/>
</React.Fragment>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
