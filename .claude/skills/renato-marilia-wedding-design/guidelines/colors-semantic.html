<!-- @dsCard group="Colors" viewport="700x130" name="Semantic Aliases" subtitle="Page / card / text / accent usage" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:8px;height:100px;font-family:var(--font-serif);font-size:14px">
<div style="flex:1;background:var(--surface-page);border:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">surface-page</div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;color:var(--text-primary)">surface-card</div>
<div style="flex:1;background:var(--surface-deep);display:flex;align-items:center;justify-content:center;color:var(--text-on-deep)">surface-deep</div>
<div style="flex:1;background:var(--surface-page);border:1px solid var(--border-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><span style="color:var(--text-primary)">text-primary</span><span style="color:var(--text-secondary)">text-secondary</span><span style="color:var(--text-gold)">text-gold</span></div>
</div>
