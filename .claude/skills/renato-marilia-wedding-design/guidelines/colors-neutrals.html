<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:120px;font-family:var(--font-label);font-size:11px;letter-spacing:.08em;color:var(--text-secondary)">
<div style="flex:1;background:var(--color-ivory);display:flex;align-items:flex-end;padding:10px;border:1px solid var(--border-subtle)">IVORY #FAF7F0</div>
<div style="flex:1;background:var(--color-ivory-deep);display:flex;align-items:flex-end;padding:10px;border:1px solid var(--border-subtle)">IVORY DEEP #F2ECDF</div>
<div style="flex:1;background:var(--color-white);display:flex;align-items:flex-end;padding:10px;border:1px solid var(--border-subtle)">WHITE #FFFFFF</div>
<div style="flex:1;background:var(--color-charcoal);display:flex;align-items:flex-end;padding:10px;color:var(--text-on-deep)">CHARCOAL #363530</div>
</div>
