# Overlay de TLS para o deploy público (a VPS da Azure).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d --build
#
# Sozinho o docker-compose.prod.yml serve HTTP puro na porta 80, o que é
# adequado para testar em máquina local e inaceitável na internet: o login dos
# convidados viajaria em texto puro. Este arquivo põe o Caddy na frente, que
# emite e renova o certificado Let's Encrypt automaticamente.
#
# Pré-requisitos: DOMAIN apontando para o IP público da VM e as portas 80 e 443
# liberadas no Network Security Group da Azure. A 80 é obrigatória mesmo com o
# site em HTTPS — é por ela que o Let's Encrypt valida o domínio.

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      # Aspas obrigatórias: o ":" dentro da mensagem de erro quebra o YAML.
      DOMAIN: "${DOMAIN:?defina DOMAIN no .env, ex. casamento.exemplo.com}"
      TLS_EMAIL: "${TLS_EMAIL:?defina TLS_EMAIL no .env, para avisos de expiração}"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # NÃO remova este volume: ele guarda os certificados. Perdê-lo obriga a
      # reemitir tudo, e o Let's Encrypt tem limite de 5 emissões por domínio
      # por semana.
      - caddy-data:/data
      - caddy-config:/config

  frontend:
    # Quem fala com a internet agora é o Caddy. `!reset` zera a lista herdada
    # do compose de produção em vez de somar a ela.
    ports: !reset []

  backend:
    environment:
      # Agora existe TLS na frente. Sem isto o cookie de sessão vai sem a flag
      # Secure; com isto e SEM TLS, o navegador descarta o cookie em silêncio e
      # ninguém consegue logar.
      COOKIE_SECURE: "true"
      # Derivado do DOMAIN em vez de vir do PUBLIC_ORIGIN: assim não há como
      # o CORS apontar para um host diferente do que o Caddy está servindo.
      CORS_ORIGIN: "https://${DOMAIN}"

volumes:
  caddy-data:
  caddy-config:
